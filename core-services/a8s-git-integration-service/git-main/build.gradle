plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}
dependencies {
    implementation project(':core-services:a8s-git-integration-service:git-application')
    implementation project(':core-services:a8s-git-integration-service:git-dataaccess')
    implementation project(':core-services:a8s-git-integration-service:git-infrastructure-providers')
    implementation project(':core-services:a8s-git-integration-service:git-message')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
}