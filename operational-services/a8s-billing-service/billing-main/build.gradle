plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':common-libraries:a8s-common-core')
    implementation project(':common-libraries:a8s-common-events')
    implementation 'com.stripe:stripe-java:24.23.0'
    implementation 'kh.gov.nbc.bakong_khqr:sdk-java:1.0.0.16'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.itextpdf:kernel:7.2.6'
    implementation 'com.itextpdf:layout:7.2.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'
    implementation 'org.springframework.cloud:spring-cloud-starter-stream-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
}