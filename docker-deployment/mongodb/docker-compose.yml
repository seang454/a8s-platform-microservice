services:
  mongodb-itp:
    image: mongo:7.0
    container_name: mongodb-itp
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: itpusr
      MONGO_INITDB_ROOT_PASSWORD: itp@168
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "itpusr", "-p", "itp@168", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./init_scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongodb_itp_data:/data/db
      - mongodb_itp_log_vol:/var/log/mongodb/
    networks:
      - itp-net

  # Web UI to easily view collections, documents, and query data
  mongo-express-itp:
    image: mongo-express:latest
    container_name: mongo-express-itp
    restart: always
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: itpusr
      ME_CONFIG_MONGODB_ADMINPASSWORD: itp@168
      ME_CONFIG_MONGODB_URL: mongodb://itpusr:itp%40168@mongodb-itp:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: qwer
    depends_on:
      mongodb-itp:
        condition: service_healthy
    networks:
      - itp-net

volumes:
  mongodb_itp_data:
  mongodb_itp_log_vol:

networks:
  itp-net:
    external: true
